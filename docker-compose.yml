# Local development stack: the database.
#
# The migration service itself runs on the host (pnpm dev) so the edit/test loop
# stays fast; this file provides its dependencies.
#
# n8n lives in docker-compose.n8n.yml rather than here. It requires an
# encryption key and an API token to be set, and Docker interpolates every
# variable in a file before it decides which services to start -- so keeping
# n8n here meant `docker compose up -d postgres` failed with "set
# N8N_ENCRYPTION_KEY" for someone who only wanted a database. Splitting the
# files keeps that requirement strict where it belongs without blocking the
# common path.
#
#   docker compose up -d postgres                      # database only
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.n8n.yml up -d     # database + n8n

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: builderlync
      POSTGRES_PASSWORD: builderlync
      POSTGRES_DB: builderlync_migration
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U builderlync']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
